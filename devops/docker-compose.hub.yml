version: "3.9"

# Docker Swarm stack for the Probe Hub on its own, behind a Traefik v3
# edge (WAF, security headers, rate limiting through global@file).
#
# This file is for a company running only the hub, from the published image.
# The probe.technology deployment does not use it: PulsarCD deploys a single
# stack from docker-compose.swarm.yml, where the hub is the probe-app
# service on app.probe.technology. Change the domain here and this stack stands
# alone.
#
# The hub keeps its state in one volume: sealed forge tokens, the tracked
# repositories and a bounded report history. Back that volume up together with
# the session key secret; losing either means every user signs in again and
# reinstalls their webhooks.
#
# Credentials are Docker secrets, never environment variables. Create them
# before the first deployment:
#
#   openssl rand -hex 32 | docker secret create probe_hub_session_key -
#   printf %s "$CLIENT_SECRET" | docker secret create probe_hub_github_client_secret -
#
# For GitLab, create probe_hub_gitlab_client_secret instead and swap the
# secret entries below. To rotate the session key, create a new secret, mount
# the old one as PROBE_HUB_SESSION_KEY_PREVIOUS and redeploy: the hub
# reseals the stored credentials at start-up (see hub/README.md).
#
# A company deploying this internally only has to change the domain, the OAuth
# application variables and, when GitHub Enterprise or a self-managed GitLab is
# used, the forge host variables.

services:
  probe-hub:
    image: ${PROBE_HUB_IMAGE:-gvinsot/probe-hub:latest}
    build:
      context: ..
      dockerfile: hub/Dockerfile
      args:
        VERSION: "${VERSION:-dev}"
    environment:
      PROBE_HUB_BASE_URL: "https://${PROBE_HUB_DOMAIN:-hub.probe.technology}"
      PROBE_HUB_DATA_DIR: /var/lib/probe-hub
      # A public instance supports lint and read-only AI review. A deployment whose users
      # are known may set private and review, which then also needs a Docker
      # socket and PROBE_HUB_REVIEW_POLICIES listing the validated
      # repositories and policy digests; every other repository is linted.
      PROBE_HUB_INSTANCE: "${PROBE_HUB_INSTANCE:-public}"
      PROBE_HUB_MODE: "${PROBE_HUB_MODE:-auto}"
      PROBE_REVIEWER_ENDPOINT: "${PROBE_REVIEWER_ENDPOINT:-}"
      PROBE_REVIEWER_MODEL: "${PROBE_REVIEWER_MODEL:-}"
      # If the provider needs a key, mount a secret at /run/secrets/PROBE_API_KEY.
      PROBE_REVIEWER_ALLOW_INSECURE_HTTP: "${PROBE_REVIEWER_ALLOW_INSECURE_HTTP:-false}"
      PROBE_HUB_REVIEW_POLICIES: "${PROBE_HUB_REVIEW_POLICIES:-}"
      PROBE_HUB_USER_QUOTA: "${PROBE_HUB_USER_QUOTA:-8}"
      PROBE_HUB_HOOK_RATE: "${PROBE_HUB_HOOK_RATE:-30}"
      PROBE_HUB_WORKERS: "${PROBE_HUB_WORKERS:-2}"
      PROBE_HUB_DEFAULT_BRANCH_ONLY: "${PROBE_HUB_DEFAULT_BRANCH_ONLY:-false}"
      # Lend the reviewer LLM to `probe login` users (see hub/README.md).
      PROBE_HUB_LLM_GATEWAY: "${PROBE_HUB_LLM_GATEWAY:-false}"
      PROBE_HUB_LLM_DAILY_TOKENS: "${PROBE_HUB_LLM_DAILY_TOKENS:-2000000}"
      PROBE_HUB_GITHUB_CLIENT_ID: "${PROBE_HUB_GITHUB_CLIENT_ID:-}"
      PROBE_HUB_GITHUB_URL: "${PROBE_HUB_GITHUB_URL:-https://github.com}"
      PROBE_HUB_GITHUB_API_URL: "${PROBE_HUB_GITHUB_API_URL:-https://api.github.com}"
      PROBE_HUB_GITLAB_CLIENT_ID: "${PROBE_HUB_GITLAB_CLIENT_ID:-}"
      PROBE_HUB_GITLAB_URL: "${PROBE_HUB_GITLAB_URL:-https://gitlab.com}"
      # The secrets below are mounted at /run/secrets/<NAME>; the _FILE
      # variables make the hub read them from there.
      PROBE_HUB_SESSION_KEY_FILE: /run/secrets/PROBE_HUB_SESSION_KEY
      PROBE_HUB_GITHUB_CLIENT_SECRET_FILE: /run/secrets/PROBE_HUB_GITHUB_CLIENT_SECRET
    secrets:
      - source: probe_hub_session_key
        target: PROBE_HUB_SESSION_KEY
        uid: "10001"
        mode: 0400
      - source: probe_hub_github_client_secret
        target: PROBE_HUB_GITHUB_CLIENT_SECRET
        uid: "10001"
        mode: 0400
    volumes:
      - probe-hub-data:/var/lib/probe-hub
    networks:
      - proxy
    deploy:
      # One replica: the state directory is local to the task.
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.gpu == none
      update_config:
        order: stop-first
        parallelism: 1
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=proxy"
        - "traefik.http.services.probe-hub.loadbalancer.server.port=8080"

        # HTTPS router
        # The webhook URL carries the installation token in its query
        # (/hooks/<key>?token=...): GitHub cannot send a custom header. The
        # edge's access log must not record query strings — see "Proxy access
        # logs" in hub/README.md (accesslog.format=json with
        # accesslog.fields.queryparameters.defaultmode=drop). This is static
        # edge configuration; labels cannot set it.
        - "traefik.http.routers.probe-hub.rule=Host(`${PROBE_HUB_DOMAIN:-hub.probe.technology}`)"
        - "traefik.http.routers.probe-hub.entrypoints=websecure"
        - "traefik.http.routers.probe-hub.tls.certresolver=letsencrypt"
        - "traefik.http.routers.probe-hub.middlewares=global@file"

        # OAuth callback router, without the WAF. GitHub appends the RFC 9207
        # issuer to the callback (iss=https://github.com/login/oauth), and the
        # edge WAF rejects any query argument holding a URL, so the sign-in
        # ended on a bare 403 before reaching the hub. The hub authenticates
        # this request itself (signed state pinned to a cookie, single-use
        # code); it keeps the edge headers and rate limit.
        - "traefik.http.routers.probe-hub-oauth.rule=Host(`${PROBE_HUB_DOMAIN:-hub.probe.technology}`) && (Path(`/auth/github/callback`) || Path(`/auth/gitlab/callback`))"
        - "traefik.http.routers.probe-hub-oauth.priority=1000"
        - "traefik.http.routers.probe-hub-oauth.entrypoints=websecure"
        - "traefik.http.routers.probe-hub-oauth.tls.certresolver=letsencrypt"
        - "traefik.http.routers.probe-hub-oauth.service=probe-hub"
        - "traefik.http.routers.probe-hub-oauth.middlewares=security-headers@file,rate-limit@file"

        # LLM gateway router, without the WAF: requests carry source code.
        # The hub authenticates and bounds every request itself.
        - "traefik.http.routers.probe-hub-llm.rule=Host(`${PROBE_HUB_DOMAIN:-hub.probe.technology}`) && PathPrefix(`/llm/`)"
        - "traefik.http.routers.probe-hub-llm.priority=1000"
        - "traefik.http.routers.probe-hub-llm.entrypoints=websecure"
        - "traefik.http.routers.probe-hub-llm.tls.certresolver=letsencrypt"
        - "traefik.http.routers.probe-hub-llm.service=probe-hub"
        - "traefik.http.routers.probe-hub-llm.middlewares=security-headers@file,rate-limit@file"

        # HTTP -> HTTPS redirect
        - "traefik.http.routers.probe-hub-http.rule=Host(`${PROBE_HUB_DOMAIN:-hub.probe.technology}`)"
        - "traefik.http.routers.probe-hub-http.entrypoints=web"
        - "traefik.http.routers.probe-hub-http.middlewares=redirect-to-https@file"
        - "traefik.http.routers.probe-hub-http.service=noop@internal"

secrets:
  probe_hub_session_key:
    external: true
  probe_hub_github_client_secret:
    external: true

volumes:
  probe-hub-data:

networks:
  proxy:
    external: true
