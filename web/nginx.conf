# Static site behind Traefik; security headers, WAF and rate limiting are
# applied by the global@file middleware at the edge.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types application/xml text/css image/svg+xml text/plain application/javascript;

    # No file is fingerprinted: pages, stylesheet, script and images keep
    # their names across deployments. A browser may keep a copy but must
    # revalidate it on every load, so a refresh after a deployment never pairs
    # a new page with an old site.js or styles.css. Unchanged files cost a 304
    # through the ETag and Last-Modified nginx derives from each file.
    etag on;
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # A missing page gets a real 404 status with a page that leads back to
    # the site, and that search engines do not index.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # The translated site (web/scripts/i18n.py) answers a missing page with
    # the 404 page of its language.
    location ~ ^/(?:fr|es|de|pt|it)/404\.html$ {
        internal;
    }
    location ~ ^/(?<lang>fr|es|de|pt|it)/ {
        try_files $uri $uri/ =404;
        error_page 404 /$lang/404.html;
    }
}
