name: CI
on:
  push:
    # A release tag points at a commit CI already tested on its branch, and
    # release.yml verifies it again before publishing.
    tags-ignore: ['v*']
  pull_request:
permissions:
  contents: read
defaults:
  run:
    working-directory: app
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/probe
      - if: runner.os == 'Linux'
        run: go test -race ./...
      - if: runner.os == 'Linux'
        run: docker pull golang:1.26-bookworm
      - if: runner.os == 'Linux'
        env:
          PROBE_TEST_DOCKER_IMAGE: golang:1.26-bookworm
        run: go test ./... -run Docker -count=1 -timeout 30m -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache: false
      - name: Build Windows and Linux archives
        shell: bash
        run: go run ./tools/build -version "dev-${GITHUB_SHA:0:12}" -out dist
      - name: Upload Windows and Linux archives
        uses: actions/upload-artifact@v4
        with:
          name: probe-build
          path: |
            app/dist/*.tar.gz
            app/dist/*.zip
            app/dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    env:
      # desktop/ is a separate module, outside the repository go.work.
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache: false
      - run: go vet ./...
      - run: go test ./...
      # On macOS this builds with cgo, like the released application.
      - run: go build ./cmd/probe-desktop
      - if: runner.os == 'Linux'
        run: go test -race ./...
      - if: runner.os == 'Linux'
        name: Check formatting
        run: test -z "$(gofmt -l .)"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the website image
        run: docker build -t probe-web:ci .
