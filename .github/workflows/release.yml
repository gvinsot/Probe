name: Build release artifacts

# Manual only. PulsarCD tags every commit it builds, and the website already
# serves the CLI archives and the Windows executables of each production
# version (web/Dockerfile). A GitHub release is for a version meant to be
# pinned by checksum (review.yml, the PulsarCD installer) and for the macOS
# application: run this workflow from that version's tag.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to embed (for example v0.1.0); blank for a dev build'
        type: string
        default: ''
      publish:
        description: 'Publish a GitHub Release after verification'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_PUBLISH: ${{ inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          version="${REQUESTED_VERSION:-dev-${GITHUB_SHA:0:12}}"
          publish="${REQUESTED_PUBLISH:-false}"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="$GITHUB_REF_NAME"
            publish=true
          fi
          [[ "$version" =~ ^[0-9A-Za-z][0-9A-Za-z._+-]{0,127}$ ]] || exit 1
          if [[ "$publish" == true ]]; then
            [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  # The CLI module builds on its own Go version: the root go.work, which also
  # covers the hub, requires a newer one.
  verify:
    needs: prepare
    defaults:
      run:
        working-directory: app
    env:
      GOWORK: 'off'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: app/go.mod
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - if: runner.os == 'Linux'
        run: go test -race ./...
      - if: runner.os == 'Linux'
        run: docker pull golang:1.26-bookworm
      - if: runner.os == 'Linux'
        env:
          PROBE_TEST_DOCKER_IMAGE: golang:1.26-bookworm
        run: go test ./internal/harness ./internal/cli -run Docker -count=1 -timeout 30m -v

  build:
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    env:
      GOWORK: 'off'
      TARGET_GOOS: ${{ matrix.goos }}
      TARGET_GOARCH: ${{ matrix.goarch }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: app/go.mod
          cache: false
      - name: Build and package
        shell: bash
        run: |
          set -euo pipefail
          go run ./tools/build -version "$VERSION" -out dist \
            -targets "$TARGET_GOOS/$TARGET_GOARCH"
      - uses: actions/upload-artifact@v7
        with:
          name: probe-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            app/dist/*.tar.gz
            app/dist/*.zip
          if-no-files-found: error
          retention-days: 30

  # Probe Desktop ships in the same release as the CLI. The Windows
  # executable cross-compiles without cgo; the macOS application needs a Mac
  # runner, since its tray icon and web view go through Cocoa with cgo.
  desktop-verify:
    needs: prepare
    defaults:
      run:
        working-directory: desktop
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # desktop/ is a separate module, outside the repository go.work.
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache: false
      - run: go vet ./...
      - run: go test ./...
      - if: runner.os == 'Linux'
        run: go test -race ./...

  desktop-windows:
    needs: [prepare, desktop-verify]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    env:
      GOWORK: 'off'
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache: false
      # -H=windowsgui builds a GUI program: Windows never opens a console for it.
      - name: Build
        shell: bash
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -trimpath -ldflags "-H=windowsgui -s -w -X main.version=$VERSION" \
            -o "dist/probe-desktop-$VERSION-windows-$GOARCH.exe" ./cmd/probe-desktop
      - uses: actions/upload-artifact@v7
        with:
          name: probe-desktop-windows-${{ matrix.goarch }}
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30

  desktop-macos:
    needs: [prepare, desktop-verify]
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    env:
      GOWORK: 'off'
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache: false
      - run: go test ./...
      - name: Build the universal application
        run: bash scripts/build-macos.sh "$VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: probe-desktop-darwin-universal
          path: desktop/dist/*.zip
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [prepare, checksums]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.prepare.outputs.version }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: probe-release
          path: dist
      - name: Verify archives and publish release
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check SHA256SUMS)
          notes="app/docs/releases/$VERSION.md"
          options=(--generate-notes)
          if [[ -f "$notes" ]]; then options=(--notes-file "$notes"); fi
          if [[ "$VERSION" == *-* ]]; then options+=(--prerelease); fi
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then options+=(--verify-tag); fi
          gh release create "$VERSION" dist/*.zip dist/*.tar.gz dist/*.exe dist/SHA256SUMS \
            --target "$GITHUB_SHA" --title "Probe $VERSION" --draft "${options[@]}"
          gh release edit "$VERSION" --draft=false

  checksums:
    needs: [build, desktop-windows, desktop-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: probe-*
          path: dist
          merge-multiple: true
      - name: Compute archive checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum probe-*.tar.gz probe-*.zip probe-desktop-*.exe > SHA256SUMS
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: probe-release
          path: dist/*
          if-no-files-found: error
          retention-days: 30
